name: CI

# Runs on every push and pull request, and is reused by the release workflow so
# that nothing is published from a build that did not pass.

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'release/images/**'
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.1'
  # The analyzer reports ~180 infos/warnings today. Errors always fail the build;
  # this budget stops the number growing without anyone noticing.
  ANALYZE_BUDGET: '190'

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::flutter analyze reported errors"
            exit 1
          fi
          count=$(grep -oE '[0-9]+ issues? found' analyze.log | grep -oE '^[0-9]+' || echo 0)
          echo "analyzer issues: $count (budget $ANALYZE_BUDGET)"
          echo "### Analyzer: $count issues (budget $ANALYZE_BUDGET)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt "$ANALYZE_BUDGET" ]; then
            echo "::error::analyzer issues grew past the budget ($count > $ANALYZE_BUDGET)"
            exit 1
          fi

      - name: Test
        run: flutter test --no-pub
